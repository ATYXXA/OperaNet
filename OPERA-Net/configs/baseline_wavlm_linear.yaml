# Current PDF reproduction. Unspecified hyperparameters are implementation choices.
seed: 42
device: cuda
out_dir: exp/baseline_wavlm_linear
epochs: 10
train_batch_size: 16
eval_batch_size: 32
num_workers: 4
amp: false
log_interval: 200
eval_every: 1
grad_clip: 5.0
loss: weighted_ce
class_weight_mode: inverse
model:
  name: wavlm_linear
  params:
    pretrained: C:/Code/SVDD/wavlm-base-plus
    feat_dim: 256
    num_classes: 2
    target_frames: 100
    pooling: mean
optim:
  lr_head: 0.0001
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
  warmup_ratio: 0.03
  min_lr_ratio: 0.05
data:
  train:
    kind: ctrsvdd
    root: C:/Code/SVDD/CtrSVDD2024_Baseline/dataset
    splits:
    - train
    mode: random
    check_exists: true
  eval:
    kind: ctrsvdd
    root: C:/Code/SVDD/CtrSVDD2024_Baseline/dataset
    splits:
    - dev
    mode: center
    check_exists: true
  cross_eval:
    kind: singfake
    root: C:/Code/SVDD/singfake_dataset
    subsets:
    - T01
    - T02
    - T03
    track_level: false
  test:
    kind: ctrsvdd
    root: C:/Code/SVDD/CtrSVDD2024_Baseline/dataset
    splits:
    - test
    mode: center
    check_exists: true
paper:
  source: docs/paper_reference.json
  status: reproduction_not_original
  metrics:
  - EER
  unspecified_settings: See docs/paper_reference.json
